name: Bypass Cloudflare for Github Action
description: Manages IP whitelisting in Cloudflare to make sure GitHub Action runner can access a Cloudflare-proxied host.
branding:
  icon: shield-off
  color: blue
inputs:
  cf_account_id:
    description: Cloudflare Account ID
    required: true
  cf_zone_id:
    description: Cloudflare Zone ID
    required: true
  cf_api_token:
    description: Cloudflare API Token
    required: true
  disable_bot_fight_mode:
    description: Disable Bot Fight Mode during workflow execution (requires Bot Management > Edit and Zone > Read permissions)
    required: false
    default: 'false'
  bfm_propagation_delay:
    description: Seconds to wait after disabling Bot Fight Mode for settings to propagate
    required: false
    default: '10'
runs:
  using: composite
  steps:
    - name: Validate Inputs and Get Runner Public IP
      shell: bash
      env:
        CF_ACCOUNT_ID: ${{ inputs.cf_account_id }}
        CF_ZONE_ID: ${{ inputs.cf_zone_id }}
        CF_API_TOKEN: ${{ inputs.cf_api_token }}
        DISABLE_BFM: ${{ inputs.disable_bot_fight_mode }}
        BFM_DELAY: ${{ inputs.bfm_propagation_delay }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        source "$ACTION_PATH/scripts/cloudflare.sh"
        for name in CF_ACCOUNT_ID CF_ZONE_ID; do
          if [[ ! "${!name}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            cf_error "$name must be a 32-character hexadecimal Cloudflare ID. Check your Actions secrets."
            exit 1
          fi
        done
        if [[ -z "$CF_API_TOKEN" ]]; then
          cf_error 'cf_api_token is empty. Check your Actions secrets (including fork PR secret availability).'
          exit 1
        fi
        if [[ "$DISABLE_BFM" != true && "$DISABLE_BFM" != false ]]; then
          cf_error 'disable_bot_fight_mode must be true or false.'
          exit 1
        fi
        if [[ ! "$BFM_DELAY" =~ ^[0-9]+$ ]]; then
          cf_error 'bfm_propagation_delay must be a non-negative integer in seconds.'
          exit 1
        fi
        if ! ip=$(curl --fail --silent --show-error --connect-timeout 15 --max-time 30 https://api64.ipify.org); then
          cf_error 'Failed to retrieve the runner public IP from ipify.'
          exit 1
        fi
        # Validate IPv4/IPv6 and prevent multiline data from entering GITHUB_ENV.
        if ! python3 -c 'import ipaddress, sys; ipaddress.ip_address(sys.argv[1])' "$ip" 2>/dev/null; then
          cf_error 'ipify returned an invalid public IP address.'
          exit 1
        fi
        echo "public_ip=$ip" >> "$GITHUB_ENV"
    - name: Check Existing CF IP List (Lists API)
      shell: bash
      id: check_ip_list
      env:
        CF_ACCOUNT_ID: ${{ inputs.cf_account_id }}
        CF_API_TOKEN: ${{ inputs.cf_api_token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        source "$ACTION_PATH/scripts/cloudflare.sh"
        list_name="bypass_cloudflare_for_github_action_list"
        response=$(cf_request GET "/accounts/$CF_ACCOUNT_ID/rules/lists" '.result | type == "array" and all(.[]; (.name | type == "string") and (.id | type == "string" and test("^[a-fA-F0-9]{32}$")))')
        list_id=$(jq -r --arg name "$list_name" '[.result[] | select(.name == $name) | .id] | first // empty' <<< "$response")
        echo 'list_created=false' >> "$GITHUB_ENV"
        if [[ -n "$list_id" ]]; then
          echo "Found existing list '$list_name' with ID: $list_id"
          echo 'list_exists=true' >> "$GITHUB_ENV"
          echo "list_id=$list_id" >> "$GITHUB_ENV"
          echo "list_id=$list_id" >> "$GITHUB_OUTPUT"
        else
          echo "List '$list_name' not found. It will be created."
          echo 'list_exists=false' >> "$GITHUB_ENV"
          echo 'list_id=' >> "$GITHUB_ENV"
        fi
    - name: (Setup only) Create CF IP List (Lists API)
      shell: bash
      id: create_ip_list
      if: env.list_exists != 'true'
      env:
        CF_ACCOUNT_ID: ${{ inputs.cf_account_id }}
        CF_API_TOKEN: ${{ inputs.cf_api_token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        source "$ACTION_PATH/scripts/cloudflare.sh"
        body=$(jq -n '{kind: "ip", name: "bypass_cloudflare_for_github_action_list", description: "Generated by xiaotianxt/bypass-cloudflare-for-github-action. Empty list by default."}')
        response=$(cf_request POST "/accounts/$CF_ACCOUNT_ID/rules/lists" '.result.id | type == "string" and test("^[a-fA-F0-9]{32}$")' "$body")
        list_id=$(jq -r '.result.id' <<< "$response")
        echo "Created list with ID: $list_id"
        echo "list_id=$list_id" >> "$GITHUB_ENV"
        echo "list_id=$list_id" >> "$GITHUB_OUTPUT"
        echo 'list_exists=true' >> "$GITHUB_ENV"
        echo 'list_created=true' >> "$GITHUB_ENV"
    - name: (Setup only) Create Bypass Rule for IP List (Rulesets API)
      shell: bash
      id: create_waf_rule
      if: env.list_created == 'true'
      env:
        CF_ZONE_ID: ${{ inputs.cf_zone_id }}
        CF_API_TOKEN: ${{ inputs.cf_api_token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        source "$ACTION_PATH/scripts/cloudflare.sh"
        phase_name=http_request_firewall_custom
        response=$(cf_entrypoint "/zones/$CF_ZONE_ID/rulesets/phases/$phase_name/entrypoint")
        ruleset_id=$(jq -r '.result.id // empty' <<< "$response")
        rule_payload=$(jq -n '{
          description: "Bypass for GitHub Actions",
          expression: "ip.src in $bypass_cloudflare_for_github_action_list",
          action: "skip",
          action_parameters: {
            phases: ["http_request_firewall_managed", "http_ratelimit", "http_request_sbfm"],
            ruleset: "current"
          },
          position: {index: 1}
        }')
        if [[ -n "$ruleset_id" ]]; then
          response=$(cf_request POST "/zones/$CF_ZONE_ID/rulesets/$ruleset_id/rules" '.result.id | type == "string" and length > 0' "$rule_payload")
        else
          ruleset_payload=$(jq -n --argjson rule "$rule_payload" --arg phase "$phase_name" '{kind: "zone", name: "default", phase: $phase, rules: [$rule]}')
          response=$(cf_request POST "/zones/$CF_ZONE_ID/rulesets" '.result.id | type == "string" and length > 0' "$ruleset_payload")
        fi
        echo "Configured bypass ruleset: $(jq -r '.result.id' <<< "$response")"
    - name: Save Bot Fight Mode State
      shell: bash
      if: inputs.disable_bot_fight_mode == 'true'
      env:
        CF_ZONE_ID: ${{ inputs.cf_zone_id }}
        CF_API_TOKEN: ${{ inputs.cf_api_token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        source "$ACTION_PATH/scripts/cloudflare.sh"
        response=$(cf_request GET "/zones/$CF_ZONE_ID/bot_management" '(.result.fight_mode | type == "boolean") and (.result.enable_js | type == "boolean")')
        echo "bfm_original_fight_mode=$(jq -r '.result.fight_mode' <<< "$response")" >> "$GITHUB_ENV"
        echo "bfm_original_enable_js=$(jq -r '.result.enable_js' <<< "$response")" >> "$GITHUB_ENV"
    # Register restoration BEFORE mutation, including an ambiguous network failure.
    - name: Register Bot Fight Mode Restoration
      uses: gacts/run-and-post-run@v1
      if: inputs.disable_bot_fight_mode == 'true'
      env:
        CF_API_TOKEN: ${{ inputs.cf_api_token }}
      with:
        post: |
          set -euo pipefail && \
          source '${{ github.action_path }}/scripts/cloudflare.sh' && \
          cf_request PUT '/zones/${{ inputs.cf_zone_id }}/bot_management' '.result.fight_mode == ${{ env.bfm_original_fight_mode }} and .result.enable_js == ${{ env.bfm_original_enable_js }}' '{"fight_mode":${{ env.bfm_original_fight_mode }},"enable_js":${{ env.bfm_original_enable_js }}}' > /dev/null && \
          echo 'Bot Fight Mode restored successfully.'
    - name: Disable Bot Fight Mode and Wait for Propagation
      shell: bash
      if: inputs.disable_bot_fight_mode == 'true'
      env:
        CF_ZONE_ID: ${{ inputs.cf_zone_id }}
        CF_API_TOKEN: ${{ inputs.cf_api_token }}
        BFM_DELAY: ${{ inputs.bfm_propagation_delay }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        source "$ACTION_PATH/scripts/cloudflare.sh"
        cf_request PUT "/zones/$CF_ZONE_ID/bot_management" '.result.fight_mode == false and .result.enable_js == false' '{"fight_mode":false,"enable_js":false}' > /dev/null
        echo "Bot Fight Mode disabled. Waiting $BFM_DELAY seconds for propagation."
        sleep "$BFM_DELAY"
    - name: Register IP List Cleanup
      uses: gacts/run-and-post-run@v1
      env:
        CF_API_TOKEN: ${{ inputs.cf_api_token }}
      with:
        post: |
          set -euo pipefail && \
          source '${{ github.action_path }}/scripts/cloudflare.sh' && \
          cf_request PUT '/accounts/${{ inputs.cf_account_id }}/rules/lists/${{ env.list_id }}/items' '.result.operation_id | type == "string" and length > 0' '[]' > /dev/null && \
          echo 'Cloudflare accepted the asynchronous IP list cleanup operation.'
    - name: Add Runner IP to List (Lists API)
      shell: bash
      id: add_ip_to_list
      env:
        CF_ACCOUNT_ID: ${{ inputs.cf_account_id }}
        CF_API_TOKEN: ${{ inputs.cf_api_token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        source "$ACTION_PATH/scripts/cloudflare.sh"
        payload=$(jq -nc --arg ip "$public_ip" '[{ip: $ip, comment: "GitHub Actions runner"}]')
        response=$(cf_request PUT "/accounts/$CF_ACCOUNT_ID/rules/lists/$list_id/items" '.result.operation_id | type == "string" and length > 0' "$payload")
        echo "Cloudflare accepted the asynchronous IP list update: $(jq -r '.result.operation_id' <<< "$response")"
